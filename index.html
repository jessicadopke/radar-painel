<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar</title>
  <meta name="theme-color" content="#1F5E3B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1A14" media="(prefers-color-scheme: dark)">
  <script>
    try { var t = localStorage.getItem("radar-tema"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <h1>Radar</h1>
    <p id="atualizado" class="muted" aria-live="polite">Carregando…</p>
  </header>
  <p id="aviso-velho" class="aviso" role="status" hidden></p>
  <main id="tela" tabindex="-1"></main>
  <nav class="abas" aria-label="Telas do app">
    <button type="button" data-tela="inicio" aria-label="Início">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Início</span>
    </button>
    <button type="button" data-tela="hoje" aria-label="Hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Hoje</span>
    </button>
    <button type="button" data-tela="lista" aria-label="Lista">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="4" height="4"/><rect x="3.5" y="14.5" width="4" height="4"/><path d="M11 6.5h9M11 16.5h9"/></svg><span>Lista</span>
    </button>
    <button type="button" data-tela="coleta" aria-label="Coleta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg><span>Coleta</span>
    </button>
    <button type="button" data-tela="sobre" aria-label="Sobre">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>Sobre</span>
    </button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
